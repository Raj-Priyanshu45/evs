server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    # The project-root .env file is imported as Java properties when running from /backend.
    import: optional:file:../.env[.properties]
  application:
    name: waste-wise-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  uploads:
    directory: ${UPLOAD_DIR:uploads/waste-images}
  ai:
    huggingface:
      enabled: ${HF_VISION_ENABLED:true}
      token: ${HF_TOKEN:}
      model-id: ${HF_MODEL_ID:SriramRokkam/wastewise-garbage-cls}
      model-file: ${HF_MODEL_FILE:wastewise-yolo.onnx}
      model-directory: ${HF_MODEL_DIR:models}
